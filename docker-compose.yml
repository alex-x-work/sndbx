services:
  opencode:
    build: .
    image: opencode:latest
    network_mode: host
    environment:
      - HOME=/home/ubuntu
    volumes:
      # - ~/.gitconfig:/home/ubuntu/.gitconfig:ro
      - ./opencode/config.json:/home/ubuntu/.config/opencode/config.json
      - ./workspace:/home/ubuntu/workspace
    working_dir: /home/ubuntu/workspace
    tty: true
